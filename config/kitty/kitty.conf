# Font
font_family Berkeley Mono
bold_italic_font auto
font_size 12.0

# Text Cursor
cursor_shape block
cursor_trail 1
cursor_blink_interval 0
shell_integration no-cursor

# Mouse
copy_on_select yes
confirm_os_window_close 1

# Window
# top right bottom left — keep the left inset tight against the sidebar divider
window_padding_width 8 8 8 8
# Extra pixels from non-cell-aligned window size would otherwise show as a
# black strip at the top of the left tab bar when the window is translucent.
placement_strategy top-left

# Tab — Warp-like compact left sidebar
tab_bar_edge left
tab_bar_style custom
tab_bar_align left
# tab_bar_min_tabs 1
tab_bar_margin_width 0
tab_bar_margin_height 0 0
tab_title_max_length 16
tab_activity_symbol "•"
active_tab_font_style bold
inactive_tab_font_style normal

# Color scheme
# background_opacity 0.92
# macos_blur yes
# background_blur 14
# hide_window_decorations no
macos_titlebar_color background

# Advanced
allow_remote_control yes

# OS specific tweaks 
macos_option_as_alt yes
macos_quit_when_last_window_closed yes

# Keyboard shortcuts
# 切换tab
map cmd+t new_tab_with_cwd
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# 启动默认布局
# vsplit/hsplit 只在 splits 布局下生效，否则会落到默认 fat 布局，两次都是上下分屏
enabled_layouts splits

# 右侧新增 pane（左右分屏）
map cmd+d launch --location=vsplit --cwd=current
# 下方新增 pane（上下分屏）
map cmd+shift+d launch --location=hsplit --cwd=current

# 切换焦点
map ctrl+h neighboring_window left
map ctrl+l neighboring_window right
map ctrl+k neighboring_window up
map ctrl+j neighboring_window down

# ⌘W：先关 split（window），只剩一个时再关 tab
map cmd+w close_window

# 当前工作目录名由自定义 tab renderer 绘制
tab_title_template "{title}"
active_tab_title_template "{title}"


# BEGIN_KITTY_THEME
# Cursor Dark
include current-theme.conf
# END_KITTY_THEME

# Generated by bin/kitty-theme after each theme switch.
include tab-bar-background.conf

# Keep the terminal and tab bar backgrounds slightly warmer without modifying
# the theme or its generated tab bar colors.
background #242323
tab_bar_background #242323
tab_bar_margin_color #242323
active_tab_background #242323
inactive_tab_background #242323
